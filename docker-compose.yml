services:
  postgres:
    image: postgres:18-alpine # which exact tag, and why
    container_name: tusupport_postgres  # something identifiable in `docker ps`
    restart: unless-stopped         # think about what should happen if the container crashes, or if you reboot your machine — but you didn't intentionally stop it
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
